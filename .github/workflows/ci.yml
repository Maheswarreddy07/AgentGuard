name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e "backend[dev]" pytest
      - run: cd backend && python -m pytest -q
      - run: cd sdk && python -m pytest -q
      - run: cd backend && python -m app.evaluation.cli run --json ../benchmarks/results/latest.json
