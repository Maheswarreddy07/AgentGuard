services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: agentguard, POSTGRES_PASSWORD: change-me, POSTGRES_DB: agentguard}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U agentguard"], interval: 5s, retries: 10}
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://agentguard:change-me@db:5432/agentguard
      CORS_ORIGINS: http://localhost:8080
      RETENTION_DAYS: "0"
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    depends_on: [backend]
    ports: ["8080:80"]
volumes: {pgdata: {}}
