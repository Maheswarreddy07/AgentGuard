services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: agentguard, POSTGRES_PASSWORD: change-me, POSTGRES_DB: agentguard}
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://agentguard:change-me@db:5432/agentguard
    depends_on: [db]
    ports: ["8000:8000"]
volumes: {pgdata: {}}
